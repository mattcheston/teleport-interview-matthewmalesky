# Argo CD AppProjects: what an Application may deploy, from where, to where.
#
# Argo CD's application controller is cluster-admin, so an Application is an
# arbitrary-manifest channel bounded only by its project. These projects are
# therefore applied with the admin kubeconfig (scripts/kubeconfig-deployer.sh),
# never by Argo CD itself: if the root Application managed them, anyone who can
# write an Application, or push a branch, could widen them.
#
# Both real projects pin the source to this repository; the URL is rewritten by
# the "Make it yours" step in the README. Day two: a new component needs its
# namespace, and any new cluster-scoped kind its chart renders, added to `apps`,
# then `kubectl apply --server-side -f infra/argocd/projects.yaml` as admin.
---
# Argo CD creates `default` wide open (any repo, any destination, any kind) on
# first start, and only when it is missing, so this locked copy sticks. Nothing
# may use it: empty lists permit nothing.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: default
  namespace: argocd
spec:
  description: Locked. Use root or apps.
  sourceRepos: []
  destinations: []
  clusterResourceWhitelist: []
---
# The app-of-apps (bootstrap/root-app.yaml): may create Applications in the
# argocd namespace and nothing else, cluster-scoped or otherwise.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: root
  namespace: argocd
spec:
  description: "bootstrap/: Applications in the argocd namespace only"
  sourceRepos:
    - https://github.com/mattcheston/teleport-interview-matthewmalesky.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: argocd
  namespaceResourceWhitelist:
    - group: argoproj.io
      kind: Application
  # No clusterResourceWhitelist: no cluster-scoped resources.
---
# The components in argo-apps/: one destination namespace each, and exactly the
# cluster-scoped kinds their charts render (`helm template --include-crds`).
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: apps
  namespace: argocd
spec:
  description: "argo-apps/: the demo's components"
  sourceRepos:
    - https://github.com/mattcheston/teleport-interview-matthewmalesky.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: cert-manager
    - server: https://kubernetes.default.svc
      namespace: teleport           # teleport-cluster, teleport-access
    - server: https://kubernetes.default.svc
      namespace: traefik
    - server: https://kubernetes.default.svc
      namespace: nginx
    - server: https://kubernetes.default.svc
      namespace: teleport-agent     # teleport-kube-agent
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace                        # CreateNamespace=true
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition         # cert-manager, Teleport operator, Traefik
    - group: rbac.authorization.k8s.io
      kind: ClusterRole                      # cert-manager, Teleport operator and agent, Traefik
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding               # same
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration     # cert-manager
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration   # cert-manager
    - group: networking.k8s.io
      kind: IngressClass                     # Traefik
    - group: cert-manager.io
      kind: ClusterIssuer                    # traefik/templates/clusterissuer.yaml
