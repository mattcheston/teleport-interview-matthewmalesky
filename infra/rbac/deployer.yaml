# RBAC for the people (or CI) who deploy the applications: members of the
# `deployers` group, which the client certificates issued by
# scripts/kubeconfig-deployer.sh carry in their subject (O=deployers).
#
# They can manage Argo CD Applications in the argocd namespace and read (not
# change) everything else, including the CRDs the demo uses. Nothing here
# grants exec, Secrets, or writes outside argocd: those need the kubeadm admin
# kubeconfig. So does Argo CD's own admin password: an Argo CD admin can edit
# projects and sync local manifests, which makes it an admin credential.
#
# This is one third of the deployer's boundary. The AppProjects in
# infra/argocd/projects.yaml bound where an Application may deploy and which
# kinds; the admission policy in deployer-policy.yaml binds deployer-written
# Applications to this repository at `main` with no inline overrides.
#
# Applied by scripts/kubeconfig-deployer.sh with the admin kubeconfig, before
# the deployer identity is used for the first time.
---
# Write access to Argo CD Applications, limited to the argocd namespace by the
# RoleBinding below. Not ApplicationSets: unused here, and their controller
# would create Applications as itself, outside the admission policy.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: deployer-argocd
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deployers
  namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: deployer-argocd
subjects:
  - kind: Group
    name: deployers
    apiGroup: rbac.authorization.k8s.io
---
# Read-only everywhere: the built-in `view` role (pods, logs, services,
# deployments, ingresses, ...; no secrets) plus the cluster-scoped and custom
# resources it does not know about.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: deployer-view-extra
rules:
  - apiGroups: [""]
    resources: ["nodes", "namespaces", "persistentvolumes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingressclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["argoproj.io", "cert-manager.io", "acme.cert-manager.io", "resources.teleport.dev", "traefik.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: deployers-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: Group
    name: deployers
    apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: deployers-view-extra
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: deployer-view-extra
subjects:
  - kind: Group
    name: deployers
    apiGroup: rbac.authorization.k8s.io
