apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  annotations:
    # Install cert-manager (and its CRDs) before any app that may create
    # Certificates or Issuers.
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    # Vendored wrapper chart — the upstream cert-manager chart (v1.21.3) is
    # stored in cert-manager/charts/, so syncing needs no external chart repo.
    repoURL: https://github.com/mattcheston/teleport-interview-matthewmalesky.git
    targetRevision: main
    path: cert-manager
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # cert-manager CRDs are large; server-side apply avoids the
      # last-applied-configuration annotation size limit.
      - ServerSideApply=true
