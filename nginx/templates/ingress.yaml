{{- if .Values.ingress.enabled }}
# Public route to the landing page, beside the Teleport-published one. A
# standard Ingress: the controller is whatever owns the IngressClass, and
# cert-manager issues the TLS certificate from the annotated ClusterIssuer into
# the Secret named under tls.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nginx
  labels:
    app: nginx
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.ingress.clusterIssuer }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: nginx-tls
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx
                port:
                  name: http
{{- end }}
