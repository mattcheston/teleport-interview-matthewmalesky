# Let's Encrypt account for cert-manager, solving HTTP-01 challenges through
# the Traefik IngressClass. Cluster-scoped, so one issuer serves every namespace.
# cert-manager keeps the ACME account key in the Secret named below, in its own
# namespace.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.clusterIssuer.name }}
spec:
  acme:
    email: {{ .Values.clusterIssuer.email }}
    server: {{ .Values.clusterIssuer.server }}
    privateKeySecretRef:
      name: {{ .Values.clusterIssuer.name }}-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: {{ .Values.traefik.ingressClass.name | default "traefik" }}
